<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Song List</title>
</head>
<body>
<h1>Song List</h1>
<ol>
    <li th:each="entry : ${songMap}">
        <span th:text="'Song ' + ${entry.key} + ': ' + ${entry.value}"></span>
    </li>
</ol>
</body>
</html>
